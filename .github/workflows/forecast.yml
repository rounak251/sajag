name: Daily forecast

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run the frozen models on today's data
        if: github.event_name != 'push'
        run: python -m sajag.forecast
      - name: Commit the forecast, so it cannot be changed later
        if: github.event_name != 'push'
        run: |
          git config user.name "sajag-forecast"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/live.json forecast_log
          git diff --cached --quiet || git commit -m "Forecast for $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
