[project]
name = "sajag"
version = "0.1.0"
description = "Flood and drought early warning for Bihar, scored against recorded disasters"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "requests>=2.31",
  "scikit-learn>=1.5", "lightgbm>=4.3", "joblib>=1.4",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["sajag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
